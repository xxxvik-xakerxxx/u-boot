name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-tetris:
    name: Build mt6878_tetris
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libgnutls28-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            swig \
            uuid-dev

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install \
            -r tools/binman/requirements.txt \
            -r tools/buildman/requirements.txt \
            -r tools/u_boot_pylib/requirements.txt

      - name: Compile initramfs-only previous-bootloader handoff
        run: |
          make O=build-initramfs-only mt6878_tetris_defconfig
          scripts/config --file build-initramfs-only/.config \
            --disable SAVE_PREV_BL_FDT_ADDR \
            --enable SAVE_PREV_BL_INITRAMFS_START_ADDR
          make O=build-initramfs-only olddefconfig
          make O=build-initramfs-only -j"$(nproc)" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm/lib/save_prev_bl_data.o \
            common/board_f.o \
            board/mediatek/mt6878/mt6878_tetris.o

      - name: Configure
        run: |
          . .venv/bin/activate
          make mt6878_tetris_defconfig

      - name: Test bounded LK CCCI handoff observation
        run: |
          .github/tests/run_tetris_ccci_handoff.sh

      - name: Build
        run: |
          . .venv/bin/activate
          make -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu-

      - name: Validate embedded postmarketOS boot flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          image = Path("u-boot.bin").read_bytes()
          expected = {
              "find_pmos_partitions": "part number scsi 2 super pmos_boot_part && part number scsi 2 userdata pmos_root_part",
              "set_pmos_bootargs": "fsuuid scsi 2:${pmos_boot_part} pmos_boot_uuid && fsuuid scsi 2:${pmos_root_part} pmos_root_uuid && setenv bootargs ${bootargs_base} pmos.boot_uuid=${pmos_boot_uuid} pmos.root_uuid=${pmos_root_uuid} ${bootargs_extra}",
              "load_connsys_bt": "ext4load scsi 2:${pmos_root_part} 0x85e00000 /usr/lib/firmware/connsys_bt_mt6878_mt6631.bin 0xb4e5c && test ${filesize} = b4e5c",
              "load_connsys_gnss": "ext4load scsi 2:${pmos_root_part} 0x860e0000 /usr/lib/firmware/connsys_gnss_mt6878_mt6631.bin 0x7fc68 && test ${filesize} = 7fc68",
              "load_connsys_wifi": "ext4load scsi 2:${pmos_root_part} 0x86180000 /usr/lib/firmware/connsys_wifi_mt6878_mt6631.bin 0x174c24 && test ${filesize} = 174c24",
              "load_boot_image": "ext4load scsi 2:${pmos_boot_part} 0x49000000 /boot_image.itb",
              "boot_pmos": "run scan_storage && run find_pmos_partitions && run set_pmos_bootargs && run load_connsys_bt && run load_connsys_gnss && run load_connsys_wifi && run load_boot_image && bootm 0x49000000",
              "boot_pmos_safe": "setenv bootargs_extra ${bootargs_safe}; run boot_pmos; setenv bootargs_extra",
              "normal_boot": 'if run boot_pmos; then true; else setcurs 0 3; lcdputs "Failed to boot postmarketOS!"; run menucmd; fi',
              "bootcmd": "run normal_boot",
              "button_cmd_0_name": "Volume Down",
              "button_cmd_0": "run fastboot",
          }

          for name, value in expected.items():
              record = f"{name}={value}\0".encode()
              count = image.count(record)
              if count != 1:
                  raise SystemExit(
                      f"expected one exact embedded {name} record, found {count}"
                  )

          for hardcoded in (b"ext4load scsi 2:51", b"ext4load scsi 2:52"):
              if hardcoded in image:
                  raise SystemExit(
                      f"hard-coded postmarketOS partition remains: {hardcoded!r}"
                  )

          handler = Path("board/mediatek/mt6878/mt6878_tetris.c").read_text()
          direct_boot_records = (
              'run_command("run find_pmos_partitions", 0)',
              'run_command("run set_pmos_bootargs", 0)',
              'ext4load scsi 2:${pmos_root_part} 0x85e00000',
              'ext4load scsi 2:${pmos_root_part} 0x860e0000',
              'ext4load scsi 2:${pmos_root_part} 0x86180000',
              'run_command("run load_boot_image", 0)',
              'tetris_boot_pmos(NULL)',
              'tetris_boot_pmos(env_get("bootargs_safe"))',
          )
          for record in direct_boot_records:
              if record not in handler:
                  raise SystemExit(f"missing direct boot record: {record}")
          if 'defer conninfra RO protection' in handler:
              raise SystemExit("conninfra RO EMI MPU protection is still deferred")
          if 'flush_dcache_range' in handler:
              raise SystemExit("unvalidated conninfra cache maintenance is enabled")

          board_dts = Path("arch/arm/dts/mt6878-nothing-tetris.dts").read_text()
          if "pinmux = <PINMUX_GPIO54__FUNC_GPIO54>;" not in board_dts:
              raise SystemExit("Volume Down GPIO54 is not muxed as a GPIO input")
          for record in (
              'compatible = "mediatek,mt6363-buttons-raw";',
              'label = "Volume Up";',
              'linux,code = <KEY_VOLUMEUP>;',
              'label = "Power";',
              'linux,code = <KEY_POWER>;',
          ):
              if record not in board_dts:
                  raise SystemExit(f"missing Tetris button record: {record}")

          config = Path(".config").read_text()
          for symbol in (
              "CONFIG_BUTTON_CMD=y",
              "CONFIG_BUTTON_GPIO=y",
              "CONFIG_BUTTON_MTK_PMIC=y",
              "CONFIG_BUTTON_REMAP_PHONE_KEYS=y",
              "CONFIG_DM_KEYBOARD=y",
              "CONFIG_BUTTON_KEYBOARD=y",
              "CONFIG_SAVE_PREV_BL_FDT_ADDR=y",
              "CONFIG_BOARD_LATE_INIT=y",
          ):
              if symbol not in config.splitlines():
                  raise SystemExit(f"missing Tetris button config: {symbol}")

          for record in (
              'get_preserved_prev_bl_fdt(&prev_fdt_addr, &prev_fdt_size)',
              'map_sysmem(prev_fdt_addr, prev_fdt_size)',
              'fdt_getprop(prev_fdt, prev_chosen, "atag,devinfo", &len)',
              'fdt_setprop(fdt, chosen, "atag,devinfo", tag,',
              'printf("Tetris: LK devinfo handoff unavailable: %d\\n", ret)',
          ):
              if record not in handler:
                  raise SystemExit(f"missing validated LK devinfo handoff: {record}")

          for record in (
              'fdt_node_offset_by_compatible(fdt, -1, "mediatek,mddriver")',
              '"ccci,modem_info_v2"',
              '"ccci,modem_info"',
              'tetris_ccci_buffer_reserved(fdt, desc.base, desc.size)',
              'tetris_ccci_buffer_in_lk_memory(fdt, desc.base, desc.size)',
              'access->range_allowed(desc.base, desc.size, access->context)',
              'tetris_ccci_validate_tags(buffer, &desc, result, tags)',
              'tetris_ccci_validate_payload(fdt, access, &desc, tags,',
              '"nothing,ccci-handoff-status"',
              '"observation-status"',
              '"payload-status"',
              '"structure-validated"',
              '"payload-validated"',
              'tetris_ccci_in_uboot_dram',
              'tetris_observe_ccci_handoff(fdt)',
          ):
              if record not in handler:
                  raise SystemExit(f"missing bounded LK CCCI observation: {record}")
          if "MTK_SIP_KERNEL_CCCI_CONTROL" in handler:
              raise SystemExit("CCCI observation must not invoke the CCCI SMC ABI")
          if '"runtime-ready"' in handler or '"validated"' in handler:
              raise SystemExit("structure observation must not claim modem readiness")
          ccci_parser = handler[
              handler.index("static int tetris_ccci_validate_payload"):
              handler.index("static int tetris_ccci_observe")
          ]
          ccci_runtime = handler[
              handler.index("static const void *tetris_ccci_map"):
              handler.index("void board_prep_linux")
          ]
          for forbidden in (
              "arm_smccc_smc(",
              "readl(",
              "writel(",
              "regulator_",
              "clk_",
              "reset_",
              "request_irq(",
              "dma_",
              "scp_",
          ):
              for scope in (ccci_parser, ccci_runtime):
                  if forbidden in scope:
                      raise SystemExit(
                          f"CCCI observation gained a hardware side effect: {forbidden}"
                      )
          if handler.index("tetris_observe_ccci_handoff(fdt)") > handler.index(
              "tetris_prepare_connsys_emi(fdt)",
              handler.index("void board_prep_linux"),
          ):
              raise SystemExit("CCCI observation moved after active boot preparation")

          for record in (
              '#define TETRIS_GPS_EMI_BASE\t\t0x86a00000ULL',
              'fdt_setprop_u64(fdt, gps, "emi-addr", TETRIS_GPS_EMI_BASE)',
              'tetris_publish_gps_emi_addr(fdt, gps)',
          ):
              if record not in handler:
                  raise SystemExit(f"missing fixed GPS EMI handoff: {record}")
          prepare = handler[
              handler.index("static int tetris_prepare_connsys_emi"):
              handler.index("static int tetris_handoff_devinfo")
          ]
          gps_mapping = prepare.index(
              "tetris_set_connsys_emi(MTK_SIP_CONNSYS_EMI_GPS"
          )
          gps_publish = prepare.index("tetris_publish_gps_emi_addr(fdt, gps)")
          if gps_mapping > gps_publish:
              raise SystemExit("GPS EMI address is published before its SMC mapping")
          if "if (ret)\n\t\treturn ret;" not in prepare[gps_mapping:gps_publish]:
              raise SystemExit("GPS EMI publication is not gated by SMC success")

          for record in (
              "#define TETRIS_WDT_BASE\t\t\t0x1c00a000UL",
              "#define TETRIS_WDT_NONRST_REG2\t\t0x24",
              "#define TETRIS_REBOOT_MODE_MASK\t\t0xf",
              "#define TETRIS_REBOOT_MODE_BOOTLOADER\t0x3",
              "readl(reboot_mode) & TETRIS_REBOOT_MODE_MASK",
              "clrbits_le32(reboot_mode, TETRIS_REBOOT_MODE_MASK)",
              'env_set("bootcmd", "run fastboot")',
          ):
              if record not in handler:
                  raise SystemExit(f"missing Linux reboot-to-fastboot handoff: {record}")

          soc_dts = Path("arch/arm/dts/mt6878.dtsi").read_text()
          for record in (
              "offset = <0x24>;",
              "mask = <0xf>;",
              "mode-bootloader = <0x3>;",
          ):
              if record not in soc_dts:
                  raise SystemExit(f"reboot-mode DT contract changed: {record}")

          prevbl = Path("arch/arm/lib/save_prev_bl_data.c").read_text()
          for record in (
              "reg2 = r2_arg;",
              "IS_ENABLED(CONFIG_TARGET_MT6878)",
              "reg2 >= SZ_1G",
              'fdt_has_devinfo(reg2)',
              'fdt_getprop(fdt_blob, chosen, "atag,devinfo", &len)',
              "MT6878_PREV_BL_FDT_MAX_SIZE",
              "dram_start = gd->ram_base",
              "dram_end = dram_start + gd->ram_size",
              "addr < dram_start || end > dram_end",
              "is_normal_memory_range((phys_addr_t)addr, size)",
              "PMD_ATTRINDX_MASK",
              "fdt_check_full(fdt_blob, size)",
              "copy_addr = ALIGN_DOWN(gd->start_addr_sp - size, 64)",
              "source = map_sysmem((phys_addr_t)addr, size)",
              "memmove(copy, source, size)",
              "fdt_check_full(copy, size)",
              "gd->start_addr_sp = copy_addr",
              "preserved_fdt_addr = copy_addr",
              'env_set("prevbl_fdt_addr", NULL)',
              'env_set_addr("prevbl_fdt_addr", (void *)addr)',
              "fdt_valid(&fdt_blob)",
          ):
              if record not in prevbl:
                  raise SystemExit(f"missing MT6878 legacy FDT fallback: {record}")
          if prevbl.index("fdt_has_devinfo(reg2)") > prevbl.index(
              "is_addr_accessible((phys_addr_t)addr)",
              prevbl.index("phys_addr_t get_prev_bl_fdt_addr(void)"),
          ):
              raise SystemExit("MT6878 devinfo FDT is not preferred over generic x0")
          board_f = Path("common/board_f.c").read_text()
          preserve = board_f.index("INITCALL(reserve_prev_bl_fdt)")
          malloc_reserve = board_f.index("INITCALL(reserve_malloc)")
          board_reserve = board_f.index("INITCALL(reserve_board)")
          if not malloc_reserve < preserve < board_reserve:
              raise SystemExit(
                  "LK FDT must be reserved after malloc and before board data"
              )
          reserve_guard = board_f[board_f.rfind("#if", 0, preserve):preserve]
          for symbol in (
              "SAVE_PREV_BL_FDT_ADDR",
              "SAVE_PREV_BL_INITRAMFS_START_ADDR",
          ):
              if symbol not in reserve_guard:
                  raise SystemExit(f"LK FDT reserve guard misses {symbol}")
          publish = prevbl.index('env_set_addr("prevbl_fdt_addr"')
          use_copy = prevbl.index("get_preserved_prev_bl_fdt(&preserved_addr")
          if use_copy > publish:
              raise SystemExit("original LK FDT address is published")
          if 'env_get_hex("prevbl_fdt_addr", 0)' in handler:
              raise SystemExit("Tetris runtime still trusts stale LK FDT environment")
          PY

      - name: Download LK template
        run: |
          curl -fL \
            -o /tmp/tetris-lk-template.img \
            "https://github.com/${{ github.repository }}/releases/download/tetris-lk-template/lk-template.img"

      - name: Package flashable LK image
        run: |
          python3 tools/tetris_lk_image.py \
            --template /tmp/tetris-lk-template.img \
            --payload u-boot.bin \
            --output u-boot-tetris-lk.img \
            --trim-fill 0xff \
            --align 512
          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path("u-boot-tetris-lk.img").read_bytes()
          magic, payload_size = struct.unpack_from("<II", image, 0)
          raw_payload_size = Path("u-boot.bin").stat().st_size
          expected_payload_size = (raw_payload_size + 15) & ~15
          if magic != 0x58881688:
              raise SystemExit(f"bad LK magic: {magic:#x}")
          if payload_size != expected_payload_size:
              raise SystemExit(
                  "LK payload size does not match 16-byte-aligned u-boot.bin"
              )
          if payload_size % 16:
              raise SystemExit("LK payload is not 16-byte aligned")
          if len(image) < 3 * 1024 * 1024:
              raise SystemExit("LK image is too small; template tail was not preserved")
          PY

      - name: Write artifact checksums
        run: |
          sha256sum \
            u-boot.bin \
            u-boot-tetris-lk.img \
            u-boot-nodtb.bin \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt6878-tetris-u-boot
          path: |
            u-boot
            u-boot.bin
            u-boot-tetris-lk.img
            u-boot-nodtb.bin
            u-boot.map
            SHA256SUMS
          if-no-files-found: error
