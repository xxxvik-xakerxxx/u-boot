name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-tetris:
    name: Build mt6878_tetris
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libgnutls28-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            swig \
            uuid-dev

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install \
            -r tools/binman/requirements.txt \
            -r tools/buildman/requirements.txt \
            -r tools/u_boot_pylib/requirements.txt

      - name: Configure
        run: |
          . .venv/bin/activate
          make mt6878_tetris_defconfig

      - name: Build
        run: |
          . .venv/bin/activate
          make -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu-

      - name: Validate embedded postmarketOS boot flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          image = Path("u-boot.bin").read_bytes()
          expected = {
              "load_connsys_bt": "ext4load scsi 2:52 0x85e00000 /usr/lib/firmware/connsys_bt_mt6878_mt6631.bin 0xb4e5c 0x200 && test ${filesize} = b4e5c",
              "load_connsys_gnss": "ext4load scsi 2:52 0x860e0000 /usr/lib/firmware/connsys_gnss_mt6878_mt6631.bin 0x7fc68 0x200 && test ${filesize} = 7fc68",
              "load_connsys_wifi": "ext4load scsi 2:52 0x86180000 /usr/lib/firmware/connsys_wifi_mt6878_mt6631.bin 0x174c24 0x200 && test ${filesize} = 174c24",
              "load_boot_image": "ext4load scsi 2:51 0x49000000 /boot_image.itb",
              "boot_pmos": "run scan_storage && run load_connsys_bt && run load_connsys_gnss && run load_connsys_wifi && run load_boot_image && bootm 0x49000000",
          }

          for name, value in expected.items():
              record = f"{name}={value}\0".encode()
              count = image.count(record)
              if count != 1:
                  raise SystemExit(
                      f"expected one exact embedded {name} record, found {count}"
                  )

          handler = Path("board/mediatek/mt6878/mt6878_tetris.c").read_text()
          if 'run_command("run boot_pmos", 0);' not in handler:
              raise SystemExit("fastboot OEM boot_pmos does not use the environment flow")
          PY

      - name: Download LK template
        run: |
          curl -fL \
            -o /tmp/tetris-lk-template.img \
            "https://github.com/${{ github.repository }}/releases/download/tetris-lk-template/lk-template.img"

      - name: Package flashable LK image
        run: |
          python3 tools/tetris_lk_image.py \
            --template /tmp/tetris-lk-template.img \
            --payload u-boot.bin \
            --output u-boot-tetris-lk.img \
            --trim-fill 0xff \
            --align 512
          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path("u-boot-tetris-lk.img").read_bytes()
          magic, payload_size = struct.unpack_from("<II", image, 0)
          if magic != 0x58881688:
              raise SystemExit(f"bad LK magic: {magic:#x}")
          if payload_size != Path("u-boot.bin").stat().st_size:
              raise SystemExit("LK payload size does not match u-boot.bin")
          if len(image) < 3 * 1024 * 1024:
              raise SystemExit("LK image is too small; template tail was not preserved")
          PY

      - name: Write artifact checksums
        run: |
          sha256sum \
            u-boot.bin \
            u-boot-tetris-lk.img \
            u-boot-nodtb.bin \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt6878-tetris-u-boot
          path: |
            u-boot
            u-boot.bin
            u-boot-tetris-lk.img
            u-boot-nodtb.bin
            u-boot.map
            SHA256SUMS
          if-no-files-found: error
