name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-tetris:
    name: Build mt6878_tetris
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libgnutls28-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            swig \
            uuid-dev

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install \
            -r tools/binman/requirements.txt \
            -r tools/buildman/requirements.txt \
            -r tools/u_boot_pylib/requirements.txt

      - name: Configure
        run: |
          . .venv/bin/activate
          make mt6878_tetris_defconfig

      - name: Build
        run: |
          . .venv/bin/activate
          make -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt6878-tetris-u-boot
          path: |
            u-boot
            u-boot.bin
            u-boot.dtb
            u-boot-nodtb.bin
            u-boot.map
          if-no-files-found: ignore
